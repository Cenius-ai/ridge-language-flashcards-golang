<!DOCTYPE html>
<html lang="en" class="">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Ridge Flashcards{% endblock %}</title>
  <link rel="stylesheet" href="/static/css/output.css">
  <script>
    (function() {
      const stored = localStorage.getItem('ridge-theme');
      if (stored === 'dark' || (!stored && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.classList.add('dark');
      }
    })();
  </script>
</head>
<body class="min-h-screen bg-surface text-fg pb-20">

  {% block content %}{% endblock %}

  <!-- Bottom navigation -->
  <nav class="bottom-nav" role="navigation" aria-label="Main navigation">
    <a href="/" class="{% if active_page == "dashboard" %}active{% endif %}" aria-current="{% if active_page == "dashboard" %}page{% else %}false{% endif %}">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
      <span>Home</span>
    </a>
    <a href="/study" class="{% if active_page == "study" %}active{% endif %}" aria-current="{% if active_page == "study" %}page{% else %}false{% endif %}">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>
      <span>Study</span>
    </a>
    <a href="/cards" class="{% if active_page == "cards" %}active{% endif %}" aria-current="{% if active_page == "cards" %}page{% else %}false{% endif %}">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="14" rx="2" ry="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>
      <span>Cards</span>
    </a>
    <button onclick="toggleTheme()" class="flex flex-col items-center gap-0.5 px-4 py-1.5 rounded-lg text-fg-muted text-xs font-medium" aria-label="Toggle theme">
      <svg id="theme-icon-light" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-5 h-5"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
      <svg id="theme-icon-dark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-5 h-5 hidden"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
    </button>
  </nav>

  <script>
    function toggleTheme() {
      const html = document.documentElement;
      html.classList.toggle('dark');
      localStorage.setItem('ridge-theme', html.classList.contains('dark') ? 'dark' : 'light');
      updateThemeIcons();
    }
    function updateThemeIcons() {
      const isDark = document.documentElement.classList.contains('dark');
      document.getElementById('theme-icon-light').style.display = isDark ? 'none' : '';
      document.getElementById('theme-icon-dark').style.display = isDark ? '' : 'none';
    }
    updateThemeIcons();
  </script>
</body>
</html>
