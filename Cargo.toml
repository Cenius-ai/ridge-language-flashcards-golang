[package]
name = "ridge"
version = "0.1.0"
edition = "2021"

[dependencies]
actix-web = "4.5.1"
actix-files = "0.6.5"
askama = "0.12.1"
rusqlite = { version = "0.31.0", features = ["bundled"] }
serde = { version = "1.0.203", features = ["derive"] }
tokio = { version = "1.38.0", features = ["rt-multi-thread", "macros"] }
thiserror = "1.0.61"
chrono = { version = "0.4.38", features = ["serde"] }

[profile.dev]
debug = 0
